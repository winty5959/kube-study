# Static file server only. Routing of /api and /thumbnails etc. is the Ingress' job
# (docker-compose uses the gateway container to play that role).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
