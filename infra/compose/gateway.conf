# Plays the role of the Ingress in docker-compose: one entry point, path-based routing.
upstream frontend { server frontend:8080; }
upstream api      { server api:8000; }
upstream minio    { server minio:9000; }

server {
    listen 8080;
    client_max_body_size 11m;   # app limit is 10MB; let the api return the 413

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Presigned GETs for thumbnails and originals. The Host header must reach MinIO
    # unchanged because it is part of the SigV4 signature.
    location ~ ^/(originals|thumbnails)/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://minio;
        proxy_set_header Host $http_host;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://frontend;
    }
}
