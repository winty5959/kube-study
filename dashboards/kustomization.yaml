apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: album-dashboards
    files:
      - 01-service.json
      - 02-queue.json
      - 03-api-scaling.json
      - 04-resources.json
      - 05-thumbnail.json
