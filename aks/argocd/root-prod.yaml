apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/winty5959/kube-study.git
    targetRevision: main
    path: aks/argocd/bootstrap/prod
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers: [/operation]
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true, PruneLast=true, RespectIgnoreDifferences=true]
    retry:
      limit: 3
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
