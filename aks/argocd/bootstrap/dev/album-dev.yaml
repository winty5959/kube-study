apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: album-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: album-dev
  source:
    repoURL: https://github.com/winty5959/kube-study.git
    targetRevision: main
    path: k3s/k8s/gitops/dev/application
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true, PruneLast=true]
    retry:
      limit: 3
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
