apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: album-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: album-prod
  source:
    repoURL: https://github.com/winty5959/kube-study.git
    targetRevision: main
    path: aks/k8s/gitops/prod/application
  syncPolicy:
    syncOptions: [CreateNamespace=true, ServerSideApply=true, PruneLast=true]
    retry:
      limit: 3
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
