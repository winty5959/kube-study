apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/winty5959/album-aks-api:latest   # tag set by the overlay
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: [python, -c, "import time; time.sleep(10)"]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            timeoutSeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            timeoutSeconds: 10
            periodSeconds: 10
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: album-config }
          env:
            - name: POD_NAME   # X-Served-By header
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: album-secrets, key: POSTGRES_PASSWORD }
            # $(VAR) expansion only works for variables defined earlier in this list
            - name: DATABASE_URL
              value: postgresql://album:$(POSTGRES_PASSWORD)@postgres:5432/album
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: album-secrets, key: S3_ACCESS_KEY }
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: album-secrets, key: S3_SECRET_KEY }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: tmp   # multipart uploads spool to /tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
