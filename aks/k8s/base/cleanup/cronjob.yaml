apiVersion: batch/v1
kind: CronJob
metadata:
  name: album-cleanup
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: album-cleanup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: cleanup
              image: ghcr.io/winty5959/album-aks-api:latest
              imagePullPolicy: IfNotPresent
              command: [python, -m, app.cleanup]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              envFrom:
                - configMapRef: {name: album-config}
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: album-secrets, key: POSTGRES_PASSWORD}
                - name: DATABASE_URL
                  value: postgresql://album:$(POSTGRES_PASSWORD)@postgres:5432/album?connect_timeout=5
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: {name: album-secrets, key: S3_ACCESS_KEY}
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef: {name: album-secrets, key: S3_SECRET_KEY}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
