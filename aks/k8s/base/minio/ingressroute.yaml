# Public clients only download signed objects. S3 writes use the private Service.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: album-objects
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: Host(`album.example`) && (PathPrefix(`/originals/`) || PathPrefix(`/thumbnails/`)) && (Method(`GET`) || Method(`HEAD`))
      priority: 100
      services:
        - name: minio
          port: 9000
