apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../postgres
  - ../redis
  - ../minio
  - ../policy

patches:
  - target: {kind: StatefulSet, name: postgres}
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: postgres
  - target: {kind: StatefulSet, name: redis}
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: redis
  - target: {kind: StatefulSet, name: minio}
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: minio
