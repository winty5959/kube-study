apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2   # fixed (PRD 3.1); also the drift target for E-12
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # nginx-unprivileged
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: ghcr.io/winty5959/album-aks-frontend:latest   # tag set by the overlay
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, "sleep 10"]
          resources:
            requests: {cpu: 25m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            timeoutSeconds: 3
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: tmp   # nginx pid file and temp buffers
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
