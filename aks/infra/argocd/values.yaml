configs:
  params:
    server.insecure: true
  cm:
    application.resourceTrackingMethod: annotation
    resource.customizations.health.argoproj.io_Application: |
      hs = {status = "Progressing", message = "Waiting for child application"}
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        hs.message = obj.status.health.message or ""
      end
      if obj.status == nil or obj.status.sync == nil or obj.status.sync.status ~= "Synced" then
        hs.status = "Progressing"
      end
      return hs
    resource.customizations.health.bitnami.com_SealedSecret: |
      hs = {status = "Progressing", message = "Waiting for the SealedSecrets controller"}
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Synced" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = "Secret decrypted by the controller"
              return hs
            end
            if condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message or "The controller could not decrypt the secret"
              return hs
            end
          end
        end
      end
      return hs
controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
server:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
repoServer:
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
redis:
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
