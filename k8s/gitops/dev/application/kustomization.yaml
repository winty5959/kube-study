apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: album-dev
resources:
  - ../../../overlays/dev
  - ../../hooks
patches:
  - target: {kind: StatefulSet, name: postgres}
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
      $patch: delete
  - target: {kind: StatefulSet, name: redis}
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: redis
      $patch: delete
  - target: {kind: StatefulSet, name: minio}
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: minio
      $patch: delete
  - target: {kind: Service, name: postgres}
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
      $patch: delete
  - target: {kind: Service, name: redis}
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: redis
      $patch: delete
  - target: {kind: Service, name: minio}
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: minio
      $patch: delete
  - target: {kind: ServiceAccount, name: api}
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: api
      $patch: delete
  - target: {kind: ServiceAccount, name: worker}
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: worker
      $patch: delete
  - target: {kind: ServiceAccount, name: frontend}
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: frontend
      $patch: delete
  - target: {kind: ServiceAccount, name: postgres}
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: postgres
      $patch: delete
  - target: {kind: ServiceAccount, name: redis}
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: redis
      $patch: delete
  - target: {kind: ServiceAccount, name: minio}
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: minio
      $patch: delete
  - target: {kind: ServiceAccount, name: db-migrate}
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: db-migrate
      $patch: delete
  - target: {kind: ServiceAccount, name: album-cleanup}
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: album-cleanup
      $patch: delete
  - target: {kind: NetworkPolicy, name: default-deny}
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny
      $patch: delete
  - target: {kind: NetworkPolicy, name: allow-dns}
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-dns
      $patch: delete
  - target: {kind: NetworkPolicy, name: application-data-egress}
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: application-data-egress
      $patch: delete
  - target: {kind: NetworkPolicy, name: data-ingress}
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: data-ingress
      $patch: delete
  - target: {kind: NetworkPolicy, name: ingress-traefik}
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: ingress-traefik
      $patch: delete
  - target: {kind: NetworkPolicy, name: monitoring-scrape}
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: monitoring-scrape
      $patch: delete
  - target: {kind: NetworkPolicy, name: keda-redis}
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: keda-redis
      $patch: delete
  - target: {kind: SealedSecret, name: album-secrets}
    patch: |-
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: album-secrets
      $patch: delete
  - target: {kind: Namespace, name: album-dev}
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: album-dev
      $patch: delete
  - target: {kind: IngressRoute, name: album-objects}
    patch: |-
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: album-objects
      $patch: delete
  - target: {kind: Job, name: db-migrate}
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: db-migrate
        annotations:
          argocd.argoproj.io/hook: PreSync
          argocd.argoproj.io/sync-wave: "-1"
          argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
replacements:
  - source:
      kind: Deployment
      name: api
      fieldPath: spec.template.spec.containers.0.image
    targets:
      - select: {kind: Job, name: album-smoke}
        fieldPaths: [spec.template.spec.containers.0.image]
