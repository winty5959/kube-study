apiVersion: v1
kind: ServiceAccount
metadata:
  name: album-smoke
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postsync-traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: album-smoke
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports:
        - {protocol: TCP, port: 8000}
