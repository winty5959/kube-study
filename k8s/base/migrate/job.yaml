# Applies SQL migrations. In M2 it is applied manually alongside the app; Jobs are immutable,
# so delete it before re-applying a new image:  kubectl -n album-dev delete job db-migrate
# M3 adds retry/TTL details and M8 turns it into an ArgoCD PreSync hook.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
spec:
  backoffLimit: 6   # postgres may still be starting on first deploy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: ghcr.io/winty5959/album-api:latest   # same image as api; tag set by the overlay
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.migrate"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: album-secrets, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: postgresql://album:$(POSTGRES_PASSWORD)@postgres:5432/album?connect_timeout=5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
