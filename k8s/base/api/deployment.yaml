apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/winty5959/album-api:latest   # tag set by the overlay
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: album-config }
          env:
            - name: POD_NAME   # X-Served-By header
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: album-secrets, key: POSTGRES_PASSWORD }
            # $(VAR) expansion only works for variables defined earlier in this list
            - name: DATABASE_URL
              value: postgresql://album:$(POSTGRES_PASSWORD)@postgres:5432/album
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: album-secrets, key: S3_ACCESS_KEY }
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: album-secrets, key: S3_SECRET_KEY }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: tmp   # multipart uploads spool to /tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
