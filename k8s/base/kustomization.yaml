apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: album
    includeSelectors: false

resources:
  - postgres/statefulset.yaml
  - redis/statefulset.yaml
  - minio/statefulset.yaml
  - minio/ingressroute.yaml
  - migrate/job.yaml
  - cleanup/cronjob.yaml
  - api/deployment.yaml
  - api/hpa.yaml
  - worker/deployment.yaml
  - worker/scaledobject.yaml
  - frontend/deployment.yaml
  - ingress.yaml
  - network-policies.yaml
  - pdb.yaml
  - service-accounts.yaml

patches:
  - target: {kind: Deployment, name: api}
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: api
  - target: {kind: Deployment, name: worker}
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: worker
  - target: {kind: Deployment, name: frontend}
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: frontend
  - target: {kind: StatefulSet, name: postgres}
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: postgres
  - target: {kind: StatefulSet, name: redis}
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: redis
  - target: {kind: StatefulSet, name: minio}
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: minio
  - target: {kind: Job, name: db-migrate}
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: db-migrate
  - target: {kind: CronJob, name: album-cleanup}
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/serviceAccountName
        value: album-cleanup

# Non-secret settings shared by api and worker. The generated name gets a content hash
# suffix, so changing a value rolls the Deployments that reference it (E-10).
configMapGenerator:
  - name: album-config
    literals:
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - BUCKET_ORIGINALS=originals
      - BUCKET_THUMBNAILS=thumbnails
      - QUEUE_KEY=thumbnail:jobs
      - THUMB_SMALL_PX=200
      - THUMB_MEDIUM_PX=800
      - ARTIFICIAL_DELAY_MS=0
      - LOG_LEVEL=INFO
