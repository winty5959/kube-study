apiVersion: v1
kind: Service
metadata:
  name: worker   # exposes :8001 for metrics scraping (M4)
spec:
  selector:
    app.kubernetes.io/name: worker
  ports:
    - name: metrics
      port: 8001
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      # Give an in-flight job time to finish after SIGTERM (worker stops after the current job)
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/winty5959/album-worker:latest   # tag set by the overlay
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8001
          envFrom:
            - configMapRef: { name: album-config }
          env:
            - name: POD_NAME   # processed_by and the per-Pod in-flight queue key
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: album-secrets, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: postgresql://album:$(POSTGRES_PASSWORD)@postgres:5432/album
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: album-secrets, key: S3_ACCESS_KEY }
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: album-secrets, key: S3_SECRET_KEY }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
