[project]
name = "album-worker"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "pillow>=11.0",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.2",
    "boto3>=1.35",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
