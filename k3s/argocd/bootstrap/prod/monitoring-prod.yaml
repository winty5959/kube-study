apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.7.0
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/k3s/infra/monitoring/values.yaml
          - $values/k3s/infra/monitoring/values-prod.yaml
    - repoURL: https://github.com/winty5959/kube-study.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true, PruneLast=true]
    retry:
      limit: 3
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
