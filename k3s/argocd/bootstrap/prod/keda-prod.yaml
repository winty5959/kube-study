apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  sources:
    - repoURL: https://kedacore.github.io/charts
      chart: keda
      targetRevision: 2.21.0
      helm:
        releaseName: keda
        valueFiles:
          - $values/k3s/infra/keda/values.yaml
    - repoURL: https://github.com/winty5959/kube-study.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true, PruneLast=true]
    retry:
      limit: 3
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
