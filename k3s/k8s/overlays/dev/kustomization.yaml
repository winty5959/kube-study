apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: album-dev

resources:
  - namespace.yaml
  - ../../base
  - ../../secrets/dev/album

# M2-M6: images are built on the VM and imported into K3S (scripts/build-images.sh).
# From M7 CI rewrites newTag here with the pushed sha-<commit> tag.
images:
  - name: ghcr.io/winty5959/album-api
    newTag: sha-d8f3a38
  - name: ghcr.io/winty5959/album-worker
    newTag: sha-72655e4
  - name: ghcr.io/winty5959/album-frontend
    newTag: sha-72655e4

  - name: ghcr.io/winty5959/album-minio
    newTag: sha-72655e4

configMapGenerator:
  - name: album-config
    behavior: merge
    literals:
      - LOG_LEVEL=DEBUG

# Strict-scope ciphertext; the controller creates the stable album-secrets name.
patches:
  - target: { kind: Ingress, name: album }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: album.dev.local
      - op: copy
        from: /spec/rules/0
        path: /spec/rules/-
      - op: replace
        path: /spec/rules/1/host
        value: album.dev.localhost
  - target: {kind: IngressRoute, name: album-objects}
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: (Host(`album.dev.local`) || Host(`album.dev.localhost`)) && (PathPrefix(`/originals/`) || PathPrefix(`/thumbnails/`)) && (Method(`GET`) || Method(`HEAD`))
