apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: album-api
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [album-dev, album-prod]
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: album-worker
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [album-dev, album-prod]
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
